syntax = "proto3";

package fafnirx.v1;

// Data path between clients and the master. Every call is authenticated
// with the device token in the `authorization: Bearer <token>` metadata.
// A client can only add data; there is no call that reads or lists what is stored on the master, or removes it
// (MarkDeleted only marks a path; the data stays until retention). Update downloads are the one thing it reads.
service Collector {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Which master this is. A client remembers what it sent to a master; when the answer changes (a new
  // database, another master at the same address) that memory no longer applies and it starts over.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);

  // Answers with the chunks the master still needs: those an interrupted upload has not
  // delivered, or none when it already has the content (the current version of the path, or
  // another file of the device).
  rpc Negotiate(Manifest) returns (NegotiateResponse);

  // Client-streaming upload of chunks. Every chunk is verified against its hash and written at its
  // place in the file being assembled; the whole file is verified again by Commit.
  rpc UploadChunks(stream Chunk) returns (UploadSummary);

  // Records a new version of a path and stores the file under its own name. The upload must be complete.
  rpc Commit(CommitRequest) returns (CommitResponse);

  // Marks a path deleted on the device. Nothing is removed from the master.
  rpc MarkDeleted(DeleteRequest) returns (DeleteResponse);

  // Client binary updates, hosted by the master and signed off-box.
  rpc GetUpdateInfo(UpdateInfoRequest) returns (UpdateInfo);
  rpc DownloadUpdate(UpdateInfoRequest) returns (stream UpdateChunk);
}

message HeartbeatRequest {
  string hostname = 1;
  string os = 2;            // "windows" | "macos" | "linux"
  string client_version = 3;
  uint64 disk_total = 4;    // bytes, volume holding the collected folders
  uint64 disk_free = 5;
  repeated string errors = 6;  // recent upload errors, drained on every beat
  // What the client is doing right now. phase is empty or "idle" when nothing is going on.
  string phase = 7;            // scanning | hashing | uploading
  string current_file = 8;     // remote path of the file being worked on
  uint32 files_done = 9;
  uint32 files_total = 10;
  uint64 bytes_done = 11;      // of bytes_total, this cycle
  uint64 bytes_total = 12;
  uint64 speed_bps = 13;       // upload speed, bytes per second
}

message IdentifyRequest {}

message IdentifyResponse {
  string master_id = 1;     // random, made once per database
}

message HeartbeatResponse {
  string device_name = 1;
  int64 server_time = 2;    // unix seconds
}

// A file is described by its ordered chunk hashes. Chunks are fixed 4 MiB
// (the last one may be shorter). root_hash = blake3(chunk_hash_0 || ... || chunk_hash_n || size_le64).
message Manifest {
  string path = 1;          // relative, '/' separated, NFC normalized
  uint64 size = 2;
  bytes root_hash = 3;
  repeated bytes chunk_hashes = 4;
}

message NegotiateResponse {
  repeated uint32 missing = 1;  // indexes into Manifest.chunk_hashes
  bool already_current = 2;     // the stored current version already has this root hash
}

message Chunk {
  bytes hash = 1;
  bytes data = 2;
  bytes root_hash = 3;          // of the file this chunk belongs to
  uint32 index = 4;             // position in Manifest.chunk_hashes
}

message UploadSummary {
  uint32 stored = 1;
}

message CommitRequest {
  Manifest manifest = 1;
  int64 mtime = 2;              // unix nanoseconds
  uint32 mode = 3;              // best effort, 0 when unknown
  string renamed_from = 4;      // set when this commit is a rename
}

message CommitResponse {
  uint64 version_id = 1;
}

message DeleteRequest {
  string path = 1;
}

message DeleteResponse {}

message UpdateInfoRequest {
  string platform = 1;          // e.g. "windows-x86_64"
}

message UpdateInfo {
  bool available = 1;
  string version = 2;
  bytes sha256 = 3;
  bytes signature = 4;          // ed25519 over "fafnirx-update\n<platform>\n<version>\n<sha256 hex>"
  uint64 size = 5;
}

message UpdateChunk {
  bytes data = 1;
}
